<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} · RL Study
    {% else %}
      RL Study
    {% endif %}
  </title>

  <meta name="description"
        content="Notes on reinforcement learning, stochastic processes, and mathematical foundations.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;600&display=swap"
        rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>

  <script
    id="MathJax-script"
    async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
</head>

<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">

      <a class="site-logo" href="{{ '/' | relative_url }}">
        RL Study
      </a>

      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Notes</a>
        <a href="{{ '/about' | relative_url }}">About</a>
        <a href="https://github.com/jjinhan53111-blip"
           target="_blank"
           rel="noopener noreferrer">
          GitHub
        </a>
      </nav>

    </div>
  </header>


  <!-- Main Content -->
  <main class="page-container">
    {{ content }}
  </main>


  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">

      <span>
        © {{ site.time | date: '%Y' }} RL Study
      </span>

      <span class="footer-description">
        Reinforcement Learning · Stochastic Processes
      </span>

    </div>
  </footer>

</body>
</html>
