---
layout: default
---

<article class="post">

  <header class="post-header">

    <div class="post-category">
      REINFORCEMENT LEARNING / {{ page.categories | first }}
    </div>

    <h1 class="post-title">
      {{ page.title }}
    </h1>

    {% if page.description %}
    <p class="post-description">
      {{ page.description }}
    </p>
    {% endif %}

    <div class="post-meta">
      {{ page.date | date: "%B %d, %Y" }}
    </div>

  </header>

  <div class="post-divider"></div>

  <div class="post-content">
    {{ content }}
  </div>

</article>
